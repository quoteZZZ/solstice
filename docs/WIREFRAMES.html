<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solstice · 线框原型 v2</title>
<style>
  :root{
    --bg:#0e1014; --panel:#151a21; --line:#2b3441; --line2:#3d4a5c;
    --ink:#c8d2de; --ink2:#7e8a9a; --ink3:#4e5764;
    --accent:#e0a33e; --accent2:#3f7fa8; --warn:#b4553f; --ok:#5f8f6a;
    --mono:ui-monospace,"Cascadia Mono","Consolas",monospace;
    --sans:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;overflow:hidden}

  #nav{width:286px;flex:0 0 286px;background:#0b0d11;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  #nav h1{font-size:13px;margin:14px 14px 2px;letter-spacing:.14em;color:var(--accent);font-weight:600}
  #nav .sub{font-family:var(--mono);font-size:10px;color:var(--ink3);margin:0 14px 8px;line-height:1.6}
  #nav .sub b{color:var(--ok)}
  #boards{list-style:none;margin:0;padding:0 8px;overflow:auto;flex:1}
  #boards li{font-family:var(--mono);font-size:11px;color:var(--ink2);padding:5px 8px;border-radius:3px;cursor:pointer;display:flex;gap:7px;align-items:baseline;border:1px solid transparent}
  #boards li:hover{background:#12161c;color:var(--ink)}
  #boards li.on{background:#1b2531;color:#fff;border-color:var(--line2)}
  #boards li b{color:var(--ink3);font-weight:400;min-width:24px}
  #boards li.on b{color:var(--accent)}
  #toggles{border-top:1px solid var(--line);padding:10px 14px;display:grid;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
  #toggles label{display:flex;gap:7px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--accent);width:12px;height:12px}

  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #topbar{height:38px;flex:0 0 38px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;font-family:var(--mono);font-size:11px;color:var(--ink2)}
  #topbar .t{color:var(--ink);font-size:12px}
  #topbar .r{margin-left:auto;display:flex;gap:14px}
  #stageWrap{flex:1;position:relative;overflow:hidden;background:repeating-linear-gradient(45deg,#0b0d11 0 10px,#0c0f14 10px 20px)}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:#10141a;outline:1px solid var(--line2)}
  #notes{flex:0 0 auto;max-height:34%;overflow:auto;border-top:1px solid var(--line);background:#0b0d11;padding:12px 18px;font-size:12px;line-height:1.65}
  #notes h2{font-size:12px;margin:0 0 6px;color:var(--accent);letter-spacing:.08em}
  #notes .ref{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-bottom:8px}
  #notes ol{margin:0;padding-left:20px}
  #notes ol li{margin:3px 0}
  #notes .why{color:var(--ink2);font-size:11.5px;margin-top:8px}
  #notes .why code{color:var(--accent);font-family:var(--mono);font-size:11px}

  .abs{position:absolute}
  .w{background:#12171e;border:1px dashed var(--line2)}
  .w.solid{border-style:solid}
  .w.fill{background:#171d26}
  .lbl{font-family:var(--mono);font-size:11px;color:var(--ink2)}
  .lbl.xs{font-size:9.5px;color:var(--ink3)}
  .lbl.a{color:var(--accent)} .lbl.b{color:var(--accent2)} .lbl.w{color:var(--warn)} .lbl.ok{color:var(--ok)}
  .h{font-size:12px;color:var(--ink);font-weight:600;letter-spacing:.06em}
  .center{display:flex;align-items:center;justify-content:center;text-align:center}
  .col{display:flex;flex-direction:column} .row{display:flex}
  .gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
  .btn{border:1px solid var(--line2);border-radius:3px;font-family:var(--mono);font-size:10.5px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:5px;background:#131922}
  .btn.on{border-color:var(--accent);color:var(--accent)}
  .btn.ghost{background:transparent;border-color:#2a323d;color:var(--ink2)}
  .key{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:14px;padding:0 3px;border:1px solid var(--line2);border-radius:2px;font-family:var(--mono);font-size:9px;color:var(--ink2);background:#0f141b}
  .tag{border:1px solid var(--line2);border-radius:2px;padding:0 5px;font-family:var(--mono);font-size:9px;color:var(--ink2);display:inline-flex;align-items:center;height:15px}
  .tag.a{border-color:var(--accent);color:var(--accent)}
  .tag.b{border-color:var(--accent2);color:var(--accent2)}
  .tag.w{border-color:var(--warn);color:var(--warn)}
  .tag.ok{border-color:var(--ok);color:var(--ok)}
  .dot{border:1px dashed var(--accent);border-radius:50%}
  .dot .in{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--accent)}
  .bar{height:5px;background:#1d2530;border:1px solid var(--line);position:relative;overflow:hidden}
  .bar > i{position:absolute;left:0;top:0;bottom:0;background:var(--accent2);opacity:.75}
  .bar.warn > i{background:var(--warn)}
  .chip{height:22px;padding:0 8px;border:1px solid var(--line2);border-radius:11px;font-family:var(--mono);font-size:10px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}

  /* ---- 卡：游戏王比例 59:86 ≈ 1:1.457 → 140×204 ---- */
  .card{width:140px;height:204px;border:1px solid var(--line2);background:#161c25;position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:3px}
  .card .ribbon{height:18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;padding:0 5px;font-family:var(--mono);font-size:8.5px;color:var(--ink2)}
  .card .face{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9.5px;color:var(--ink3);border-bottom:1px dashed var(--line);padding:4px;text-align:center;line-height:1.35}
  .card .name{height:26px;display:flex;align-items:center;padding:0 6px;font-size:11.5px;color:var(--ink);border-bottom:1px dashed var(--line)}
  .card .meta{height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-family:var(--mono);font-size:9px;color:var(--ink3)}
  .card.sel{outline:2px solid var(--accent);outline-offset:-1px;box-shadow:0 0 0 1px #000 inset}
  .card.dim{opacity:.3}
  .card.sm{width:96px;height:140px}
  .card.sm .name{height:22px;font-size:10.5px}
  .card.sm .meta{height:18px;font-size:8px}
  .card.mini{width:56px;height:82px;border-radius:2px}
  .card.mini .ribbon{height:12px;font-size:7px;padding:0 3px}
  .card.mini .name{height:14px;font-size:8px;padding:0 3px}
  .card.mini .meta{display:none}
  .card.mini .face{font-size:7.5px}

  /* 抽屉把手 */
  .handle{position:absolute;width:26px;height:132px;border:1px solid var(--line2);background:#141a22;
          display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;
          color:var(--ink2);writing-mode:vertical-rl;letter-spacing:.22em;border-radius:3px}
  .drawer{position:absolute;border:1px solid var(--line2);background:rgba(18,23,30,.94);backdrop-filter:blur(2px)}

  #stage.anno .annoBox{outline:1px solid rgba(224,163,62,.35);outline-offset:2px}
  #stage:not(.anno) .anno{display:none}
  #gridBox,#safeBox{position:absolute;inset:0;pointer-events:none;display:none}
  #stage.grid #gridBox{display:block;background-image:linear-gradient(to right,rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.045) 1px,transparent 1px);background-size:8px 8px}
  #stage.safe #safeBox{display:block;outline:2px solid rgba(63,127,168,.5);outline-offset:-48px}
</style>
</head>
<body>

<aside id="nav">
  <h1>SOLSTICE · 线框原型</h1>
  <p class="sub">v2 · 2026-10-20 · 1920×1080<br>
  <b style="color:#b4553f">B0–B3 已作废</b>：抽屉改为「左 56 功能栏 + 右 320 信息栏」<br>
  现行交互以 <b style="color:#e0a33e">PROTOTYPE.html</b> 为准（可点、可拖卡）<br>
  本文件其余板仍是版式参考：卡 140×204 / 30° 侧视 / 设置分组 / 可改键</p>
  <ul id="boards"></ul>
  <div id="toggles">
    <label><input type="checkbox" id="tAnno" checked>显示标注</label>
    <label><input type="checkbox" id="tGrid">8 pt 网格</label>
    <label><input type="checkbox" id="tSafe">安全区</label>
    <label><input type="checkbox" id="tNotes" checked>问题清单</label>
  </div>
</aside>

<main>
  <div id="topbar">
    <span class="t" id="tbTitle">—</span>
    <span id="tbDesc"></span>
    <span class="r"><span id="tbIdx"></span><span>←/→ 切板</span></span>
  </div>
  <div id="stageWrap"><div id="stage"><div id="gridBox"></div><div id="safeBox"></div></div></div>
  <div id="notes"><h2>这一板想请你定的事</h2><div class="ref" id="ntRef"></div><ol id="ntList"></ol><div class="why" id="ntWhy"></div></div>
</main>

<script>
/* ================= 复用元件 ================= */
const CARD=(el,tier,kind,name,o={})=>{
  const cls=['card',o.sel?'sel':'',o.dim?'dim':'',o.size||''].join(' ');
  return `<div class="${cls}" style="${o.style||''}">
    <div class="ribbon"><span>${el}</span><span>${tier}${kind?' · '+kind:''}</span></div>
    <div class="face">${o.face||'glyph'}</div>
    <div class="name">${name}</div>
    <div class="meta"><span>${o.left||''}</span><span>${o.right||''}</span></div>
  </div>`;
};
const HAND=(list,sel)=>`<div class="abs row gap8" style="left:24px;top:822px">
  ${list.map((c,i)=>CARD(c[0],c[1],c[2],c[3],{
    sel:i===sel, style:i===sel?'transform:translateY(-18px)':'',
    left:`<span class="key">${i===9?0:i+1}</span>`, right:c[4]||''
  })).join('')}</div>`;

const HANDBAR=()=>`
  <div class="abs w fill" style="left:0;top:806px;width:1920px;height:274px;border-left:0;border-right:0;border-bottom:0"></div>
  <div class="abs lbl xs anno" style="left:24px;top:812px">手牌 10 × 140×204（1:1.457，游戏王比例）· 选中上浮 18 px</div>

  <!-- 右下动作条：只剩三个，图标＋键 -->
  <div class="abs col gap6" style="left:1660px;top:826px;width:236px">
    <div class="row gap6">
      <div class="btn on" style="width:114px;height:34px"><span class="key">空格</span>释放</div>
      <div class="btn" style="width:114px;height:34px"><span class="key">X</span>回收</div>
    </div>
    <div class="row gap6">
      <div class="btn" style="width:114px;height:34px"><span class="key">R</span>换手</div>
      <div class="btn" style="width:114px;height:34px"><span class="key">J</span>4×</div>
    </div>
    <div class="lbl xs anno">动作条只留"手上这张卡现在能做什么"，其余全进抽屉</div>
  </div>`;

const TOPBAR=()=>`
  <div class="abs w fill" style="left:0;top:0;width:1920px;height:56px;border-left:0;border-right:0;border-top:0"></div>
  <!-- 左：时钟（唯一常驻的大字） -->
  <div class="abs row gap10" style="left:24px;top:8px;height:40px;align-items:center">
    <div style="font-family:var(--mono);font-size:22px;color:#fff;line-height:1">14:20</div>
    <div class="col" style="line-height:1.3">
      <div class="lbl" style="font-size:10.5px">秋 · 第 312 天</div>
      <div class="lbl xs">多云 17°C</div>
    </div>
    <div class="chip">4×</div>
  </div>
  <!-- 中：扰动（无文字，只有刻度与颜色） -->
  <div class="abs" style="left:330px;top:20px;width:180px">
    <div class="bar warn"><i style="width:42%"></i></div>
    <div class="lbl xs" style="margin-top:3px">扰动 42</div>
  </div>
  <!-- 右：只剩图标，文字进悬停 -->
  <div class="abs row gap6" style="right:24px;top:12px">
    ${['C','B','L','G','O','H'].map(k=>`<div class="btn ghost" style="width:30px;height:30px"><span class="key">${k}</span></div>`).join('')}
    <div class="chip" style="margin-left:8px"><span class="lbl a" style="font-size:13px">128</span><span class="lbl xs">余响</span></div>
  </div>`;

const WORLD=(tag='世界 · 侧视 30° · Z2')=>`
  <div class="abs" style="left:0;top:56px;width:1920px;height:750px;border:0;
       background:linear-gradient(#22303c 0%,#1a2530 38%,#141b23 62%,#0e1318 100%)">
    <div class="lbl xs anno" style="position:absolute;left:16px;bottom:10px">${tag}</div>
  </div>
  <!-- 地平线 + 岛体（侧视轮廓） -->
  <div class="abs" style="left:0;top:392px;width:1920px;height:1px;background:rgba(200,220,235,.16)"></div>
  <div class="abs" style="left:470px;top:330px;width:980px;height:230px;border:1px dashed rgba(126,138,154,.4);
       border-radius:50% 50% 42% 42%/62% 58% 38% 42%"></div>
  <div class="abs" style="left:700px;top:352px;width:520px;height:120px;border:1px dashed rgba(126,138,154,.28);border-radius:50%"></div>
  <div class="abs" style="left:840px;top:300px;width:250px;height:120px;border:1px dashed rgba(224,163,62,.4);transform:skewY(-12deg)"></div>
  <div class="abs lbl xs anno" style="left:846px;top:282px;color:var(--accent)">山体侧面（能看到"坡"，不是俯视的圈）</div>
  <div class="abs lbl xs anno" style="left:24px;top:374px">地平线 · 天空占 1/3</div>`;

const BOARDS = [
{
  id:'B0', title:'B0 ·（作废）排版基准 v2',
  desc:'默认态没有任何常驻侧板：顶栏 56 + 世界 + 底部手牌 250。左右各一个竖向把手，点开是悬浮抽屉。',
  ref:'TECH §6.1（HUD 缩放）· ART §7（角度与缩放）· 本次改动 1/3',
  q:[
    '把手放**左右两侧中部**（如图）还是**顶栏两个按钮**？',
    '抽屉展开时要不要**压暗世界**（焦点）还是保持世界可用？',
    '底部手牌区 250 px（卡 204 + 标签）是否接受世界区让出这么多？'
  ],
  why:'v1 把左右侧板常驻，直接吃掉 620 px 宽。v2 改成抽屉后，世界区从 1300 恢复到 1920 全宽——这是"看得见世界"的前提。',
  html:`
    <div class="abs w fill" style="left:0;top:0;width:1920px;height:56px"></div>
    <div class="abs w" style="left:0;top:56px;width:1920px;height:750px;border-left:0;border-right:0"></div>
    <div class="abs w fill" style="left:0;top:806px;width:1920px;height:274px;border-left:0;border-right:0;border-bottom:0"></div>
    <div class="handle" style="left:8px;top:360px">界 · 生态</div>
    <div class="handle" style="left:1886px;top:360px">响 · 年表</div>
    <div class="abs lbl a" style="left:14px;top:16px">顶栏 56 · 时钟 / 扰动 / 六个图标 / 余响</div>
    <div class="abs lbl b" style="left:820px;top:400px">世界区 1920×750（全宽）</div>
    <div class="abs lbl a" style="left:14px;top:822px">手牌区 250 · 10 × 140×204</div>
    <div class="abs" style="left:24px;top:846px;width:140px;height:204px;border:1px dashed var(--line2)"></div>
    <div class="abs lbl xs" style="left:24px;top:1058px">卡比例 1:1.457（游戏王 59:86）</div>
    <div class="abs" style="left:1660px;top:826px;width:236px;height:96px;border:1px dashed var(--line2)"></div>
    <div class="abs lbl xs" style="left:1660px;top:930px">动作条：释放 / 回收 / 换手 / 倍速</div>
    <div class="abs lbl xs anno" style="left:1666px;top:960px">其余键位与读数一律进抽屉或帮助</div>
  `
},
{
  id:'B1', title:'B1 ·（作废·抽屉）主 HUD',
  desc:'只留五类常驻信息：时钟、余响、扰动、手牌、落点。所有读数与流水收进抽屉。',
  ref:'本次改动 1（抽屉）/ 3（文字减法）· OPS §5 · CARDS §8',
  q:[
    '常驻只剩这五类，够不够？（读数全进抽屉＝画面干净，但要动手点）',
    '顶栏图标无文字（`C B L G O H`）够不够认得？',
    '"余响 128" 放右上角还是和手牌放一起？'
  ],
  why:'原来的左板有 7 条读数条 + 世界摘要，右板有 5 条流水——这些是"看世界时不需要一直盯"的内容，属于抽屉。',
  html:`
    ${WORLD()}
    ${TOPBAR()}
    ${HANDBAR()}
    ${HAND([['土','2','物','土丘'],['水','3','术','降雨','−10'],['木','1','物','苔毯'],['火','0','术','火星'],
            ['土','5','物','土山'],['水','0','术','润湿'],['光','2','术','光斑'],['木','3','术','疯长'],
            ['暗','1','术','蚀'],['土','0','术','扬尘']],1)}
    <div class="abs dot" style="left:940px;top:470px;width:56px;height:56px"><div class="in"></div></div>
    <div class="abs anno" style="left:820px;top:390px;width:290px;height:290px;border:1px dashed rgba(224,163,62,.5);border-radius:50%"></div>
    <div class="abs lbl xs anno" style="left:820px;top:372px;color:var(--accent)">作用圈（5 环 = 0.07 W）</div>
    <div class="handle" style="left:8px;top:340px">界 · 生态</div>
    <div class="handle" style="left:1886px;top:340px">响 · 年表</div>
  `
},
{
  id:'B2', title:'B2 ·（作废·抽屉）左板',
  desc:'点左侧把手 → 480 宽悬浮面板从左边滑出，覆盖世界左上，世界仍可见可操作。',
  ref:'本次改动 1 · WORLD §9（生态域）/ §4.1（界名）',
  q:[
    '抽屉宽 480 够吗？（要放 7 条读数 + 界名 + 形制摘要）',
    '抽屉里要不要**图表**（温度曲线 / 种群曲线），还是只给数值？',
    '同一时刻能否两个抽屉都开？（建议：不能，互相替换）'
  ],
  why:'抽屉是可随时开合的"仪表盘"，不是常驻面板；它遮住的是世界左上一角，不是整块画面。',
  html:`
    ${WORLD('世界 · 抽屉覆盖左上（世界仍可点）')}
    ${TOPBAR()}
    <div class="drawer" style="left:0;top:56px;width:480px;height:750px">
      <div class="row" style="justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)">
        <span class="h">这一界</span><span class="btn ghost" style="width:24px;height:24px"><span class="key">Esc</span></span>
      </div>
      <div class="col gap10" style="padding:14px">
        <div>
          <div class="lbl xs">界名</div>
          <div style="font-size:20px;color:#fff">白环礁</div>
          <div class="lbl xs">环礁界 · 热带雨林 · 外海 · SOL-7K3M-9QX2</div>
        </div>
        ${[['植被覆盖','68%',68],['生物量','1 046',74],['多样性','7 种',46],['水体','43.6%',44],
           ['土壤肥力','0.62',62],['温度','17°C',52],['扰动','42',42]]
          .map(([k,v,w])=>`<div>
            <div class="row" style="justify-content:space-between"><span class="lbl xs">${k}</span><span class="lbl xs">${v}</span></div>
            <div class="bar"><i style="width:${w}%"></i></div></div>`).join('')}
        <div class="w" style="padding:8px;margin-top:4px">
          <div class="lbl xs">形制</div>
          <div class="lbl" style="font-size:11px;margin-top:2px">群岛 5–12 · 折枝 · 外海 · 水 43 %</div>
        </div>
        <div class="w" style="padding:8px">
          <div class="lbl xs" style="margin-bottom:4px">12 个生态域（本界 6 个）</div>
          <div class="row gap4" style="flex-wrap:wrap">

/* ================= 渲染 ================= */
const stage=document.getElementById('stage');
const navUl=document.getElementById('boards');
const ntList=document.getElementById('ntList');
const ntRef=document.getElementById('ntRef');
const ntWhy=document.getElementById('ntWhy');
const tbTitle=document.getElementById('tbTitle');
const tbDesc=document.getElementById('tbDesc');
const tbIdx=document.getElementById('tbIdx');
const notesEl=document.getElementById('notes');
let cur=0;

BOARDS.forEach((b,i)=>{
  const li=document.createElement('li');
  li.innerHTML=`<b>${b.id}</b><span>${b.title.replace(/^[A-Z]\d+ · /,'')}</span>`;
  li.onclick=()=>show(i);
  navUl.appendChild(li);
});

function show(i){
  cur=(i+BOARDS.length)%BOARDS.length;
  const b=BOARDS[cur];
  stage.innerHTML=b.html;
  const g=document.createElement('div'); g.id='gridBox';
  const s=document.createElement('div'); s.id='safeBox';
  stage.appendChild(g); stage.appendChild(s);
  stage.classList.toggle('grid',document.getElementById('tGrid').checked);
  stage.classList.toggle('safe',document.getElementById('tSafe').checked);
  stage.classList.toggle('anno',document.getElementById('tAnno').checked);
  [...navUl.children].forEach((li,k)=>li.classList.toggle('on',k===cur));
  tbTitle.textContent=b.title;
  tbDesc.textContent=b.desc;
  tbIdx.textContent=`${cur+1} / ${BOARDS.length}`;
  ntRef.textContent='规格出处：'+b.ref;
  ntList.innerHTML=b.q.map(q=>`<li>${q}</li>`).join('');
  ntWhy.innerHTML=b.why;
  notesEl.style.display=document.getElementById('tNotes').checked?'':'none';
  fit();
}

function fit(){
  const wrap=document.getElementById('stageWrap');
  const availW=wrap.clientWidth-24, availH=wrap.clientHeight-24;
  const sc=Math.min(availW/1920,availH/1080);
  stage.style.transform=`translate(-50%,-50%) scale(${sc})`;
}

document.getElementById('tGrid').onchange=e=>stage.classList.toggle('grid',e.target.checked);
document.getElementById('tSafe').onchange=e=>stage.classList.toggle('safe',e.target.checked);
document.getElementById('tAnno').onchange=e=>stage.classList.toggle('anno',e.target.checked);
document.getElementById('tNotes').onchange=e=>{notesEl.style.display=e.target.checked?'':'none';fit();};
window.onresize=fit;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')show(cur+1);
  if(e.key==='ArrowLeft')show(cur-1);
});
show(0);
</script>
