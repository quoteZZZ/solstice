<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solstice · 可点击原型 v2</title>
<style>
  :root{
    --bg:#0a0c10; --ink:#c9d3df; --ink2:#7e8a9a; --ink3:#4c5563;
    --line:#28313d; --line2:#3d4a5c; --acc:#e0a33e; --acc2:#3f7fa8; --warn:#b4553f; --ok:#5f8f6a;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
    --sans:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  #app{display:flex;height:100%}

  /* ===== 舞台外：流程评审栏 ===== */
  #tour{width:270px;flex:0 0 270px;background:#080a0e;border-right:1px solid var(--line);display:flex;flex-direction:column}
  #tour h1{font-size:12px;margin:16px 16px 4px;letter-spacing:.16em;color:var(--acc)}
  #tour .sub{font-family:var(--mono);font-size:10px;color:var(--ink3);margin:0 16px 12px;line-height:1.75}
  #steps{list-style:none;margin:0;padding:0 8px;overflow:auto;flex:1}
  #steps li{display:flex;gap:9px;align-items:baseline;padding:7px 9px;border-radius:3px;cursor:pointer;
    font-family:var(--mono);font-size:11px;color:var(--ink2);border:1px solid transparent}
  #steps li:hover{background:#10151c;color:var(--ink)}
  #steps li.on{background:#17212c;color:#fff;border-color:var(--line2)}
  #steps li b{color:var(--ink3);font-weight:400;min-width:16px}
  #steps li.on b{color:var(--acc)}
  #log{border-top:1px solid var(--line);padding:10px 14px;font-family:var(--mono);font-size:10px;color:var(--ink3);max-height:170px;overflow:auto}
  #log .a{color:var(--acc)}

  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #bar{height:34px;flex:0 0 34px;display:flex;align-items:center;gap:14px;padding:0 14px;
    border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--ink2)}
  #bar b{color:var(--ink);font-weight:500}
  #bar .r{margin-left:auto;display:flex;gap:12px;align-items:center}
  #bar button{background:transparent;border:1px solid var(--line2);color:var(--ink2);border-radius:3px;
    font-family:var(--mono);font-size:10px;padding:3px 8px;cursor:pointer}
  #bar button:hover{color:var(--acc);border-color:var(--acc)}
  #wrap{flex:1;position:relative;overflow:hidden;background:repeating-linear-gradient(45deg,#07090c 0 10px,#080a0e 10px 20px)}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;
    background:#0d1116;overflow:hidden;outline:1px solid var(--line2)}

  /* ===== 基础 ===== */
  .abs{position:absolute}
  .mono{font-family:var(--mono)}
  .xs{font-size:10px;color:var(--ink3)}
  .sm{font-size:11px;color:var(--ink2)}
  .key{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:14px;padding:0 3px;
    border:1px solid var(--line2);border-radius:2px;font-family:var(--mono);font-size:9px;color:var(--ink2);background:#0f141b}
  .tag{border:1px solid var(--line2);border-radius:2px;padding:0 5px;height:15px;display:inline-flex;align-items:center;
    font-family:var(--mono);font-size:9px;color:var(--ink2)}
  .tag.a{border-color:var(--acc);color:var(--acc)} .tag.b{border-color:var(--acc2);color:var(--acc2)}
  .tag.ok{border-color:var(--ok);color:var(--ok)} .tag.w{border-color:var(--warn);color:var(--warn)}
  .btn{border:1px solid var(--line2);border-radius:3px;background:#131922;color:var(--ink);font-family:var(--mono);
    font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;height:30px;cursor:pointer}
  .btn:hover{border-color:var(--acc);color:var(--acc)}
  .btn.on{border-color:var(--acc);color:var(--acc)}
  .btn.ghost{background:transparent;border-color:#2a323d;color:var(--ink2)}
  .bar{height:5px;background:#1b232e;border:1px solid var(--line);position:relative;overflow:hidden}
  .bar > i{position:absolute;left:0;top:0;bottom:0;background:var(--acc2);opacity:.8}
  .bar.warn > i{background:var(--warn)}

  /* ===== 世界 ===== */
  #scene{position:absolute;left:56px;top:56px;right:320px;bottom:0;overflow:hidden;
    background:linear-gradient(#33506a 0%,#243544 24%,#1a2732 40%,#0e161d 100%)}
  #ridge1,#ridge2{position:absolute;left:-4%;right:-4%;pointer-events:none}
  #ridge1{bottom:46%;height:200px;background:#1e2d38;opacity:.85;
    clip-path:polygon(0 100%,7% 56%,15% 86%,25% 44%,36% 80%,47% 38%,58% 78%,70% 50%,82% 84%,92% 54%,100% 100%)}
  #ridge2{bottom:41%;height:150px;background:#15212a;opacity:.95;
    clip-path:polygon(0 100%,10% 70%,20% 92%,32% 60%,44% 88%,56% 64%,68% 92%,80% 68%,90% 86%,100% 70%,100% 100%)}
  .cloud{position:absolute;border-radius:50%;background:rgba(232,238,242,.14);filter:blur(16px);pointer-events:none}
  #peak2{position:absolute;left:57%;top:46%;width:230px;height:170px;margin-left:-40px;
    background:linear-gradient(#516676,#2b3a46);
    clip-path:polygon(52% 0,100% 100%,0 100%)}
  #peak2:after{content:"";position:absolute;left:40%;top:0;width:24%;height:22%;
    background:rgba(226,236,240,.85);clip-path:polygon(50% 0,100% 100%,0 100%)}
  #seaband{position:absolute;left:0;right:0;top:42%;bottom:0;background:linear-gradient(#1d4557,#163646 40%,#0e222c)}
  #horizon{position:absolute;left:0;right:0;height:1px;background:rgba(205,225,240,.22)}
  #worldgroup{position:absolute;inset:0;transform-origin:50% 62%;transition:transform .45s ease}
  #island{position:absolute;left:50%;top:44%;width:1000px;height:370px;margin-left:-500px;
    border-radius:50% 50% 46% 46%/72% 72% 28% 28%;
    background:radial-gradient(ellipse at 50% 34%,#31492f 0%,#263a26 48%,#1a2a1c 100%);
    border:1px solid #3a5741;box-shadow:0 18px 44px rgba(0,0,0,.55)}
  #mount{position:absolute;left:50%;top:40%;width:320px;height:240px;margin-left:-170px;
    background:linear-gradient(#5b7180 0%,#334553 55%,#24313d 100%);
    clip-path:polygon(50% 0,100% 100%,0 100%)}
  #mount:after{content:"";position:absolute;left:39%;top:0;width:22%;height:24%;
    background:rgba(232,240,243,.9);clip-path:polygon(50% 0,100% 100%,0 100%)}
  #lagoon{position:absolute;left:50%;top:55%;width:400px;height:104px;margin-left:-110px;
    background:radial-gradient(ellipse at 50% 40%,rgba(96,190,200,.75),rgba(36,92,112,.55) 70%,rgba(20,55,68,.2));
    border:1px solid rgba(126,200,214,.45);border-radius:50%}
  #trees{position:absolute;left:50%;top:54%;width:960px;margin-left:-480px;height:140px}
  #trees i{position:absolute;bottom:0;background:linear-gradient(#3c7048,#1f3f2b);border:1px solid #2b5637;
    border-radius:46% 46% 12% 12%/64% 64% 10% 10%}
  #scene.enter #island,#scene.enter #mount,#scene.enter #lagoon,#scene.enter #trees{
    animation:pop .8s cubic-bezier(.2,.9,.2,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
  #fade{position:absolute;inset:0;background:#05070a;z-index:70;pointer-events:none;opacity:0;transition:opacity .5s}
  #fade.on{opacity:1}

  /* 世界内的仪表：比例尺 / 指北针 / Z 徽章 / 地块信息 */
  #scalebar{position:absolute;right:18px;bottom:16px;z-index:6;display:flex;align-items:center;gap:7px;
    font-family:var(--mono);font-size:10px;color:#9fb0bd;text-shadow:0 1px 3px #000}
  #scalebar .ln{width:74px;height:6px;border-left:1px solid #9fb0bd;border-right:1px solid #9fb0bd;border-bottom:1px solid #9fb0bd}
  #compass{position:absolute;right:18px;top:14px;z-index:6;width:36px;height:36px;border:1px solid #33404f;
    border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    font-size:9px;color:#8b99a6;background:rgba(10,13,18,.55)}
  #compass b{position:absolute;top:1px;font-size:8px;color:var(--acc);font-weight:400}
  #compass i{display:block;width:1px;height:12px;background:#6b7a88;transform-origin:50% 100%}
  #zchip{position:absolute;left:14px;bottom:14px;z-index:6;display:flex;gap:6px}
  #hoverinfo{position:absolute;z-index:8;pointer-events:none;display:none;border:1px solid #3d4a5c;
    background:rgba(10,13,18,.94);padding:6px 9px;font-family:var(--mono);font-size:10px;color:#cfd8e2;
    line-height:1.6;white-space:nowrap}
  #hoverinfo b{color:#fff;font-weight:500}
  #hoverring{position:absolute;z-index:5;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    border:1px solid rgba(224,163,62,.55);background:rgba(224,163,62,.08);display:none;pointer-events:none}

  /* 右栏时间线 */
  .tl{position:relative;padding-left:13px}
  .tl:before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:1px;background:#2b3441}
  .tl .it{position:relative;padding:3px 0 7px}
  .tl .it:before{content:"";position:absolute;left:-13px;top:9px;width:6px;height:6px;border-radius:50%;
    background:var(--dot,#3f7fa8);box-shadow:0 0 0 2px #0c1117}

  /* 牌堆：底边两个小方块（图形计数，不写字） */
  #deck{position:absolute;left:70px;bottom:22px;display:flex;gap:7px;z-index:34;opacity:.85}
  #deck .dk{width:38px;height:44px;border:1px solid #33404f;border-radius:3px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(14,19,26,.85)}
  #deck .dk b{font-family:var(--mono);font-size:13px;color:#dfe7ee;font-weight:500}
  #deck .dk span{font-family:var(--mono);font-size:7.5px;color:#4c5563;letter-spacing:.08em}

  /* 摆件模式：HUD 全隐，只留世界；底部一行提示 3 秒淡出 */
  #stage.ambient #top,#stage.ambient #leftrail,#stage.ambient #rightpanel,
  #stage.ambient #actbar,#stage.ambient #deck,#stage.ambient #scalebar,
  #stage.ambient #compass,#stage.ambient #zchip{opacity:0;visibility:hidden;animation:none;
    pointer-events:none;transition:opacity .45s,visibility .45s}
  #stage.ambient #hand{transform:translateY(290px);transition:transform .45s cubic-bezier(.3,.9,.3,1);pointer-events:none}
  #ambhint{position:absolute;left:0;right:0;bottom:34px;text-align:center;z-index:36;
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#8b99a6;opacity:0;pointer-events:none}
  #stage.ambient #ambhint{animation:ambFade 3.4s both}
  @keyframes ambFade{0%{opacity:0}12%{opacity:.9}70%{opacity:.9}100%{opacity:0}}

  /* 世界事件：全屏卡（禁物漏入 / 灾变 / 首个聚落） */
  #eventwrap{position:absolute;inset:0;z-index:80;background:rgba(6,9,13,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;animation:fadeIn .18s both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #eventcard{width:660px;border:1px solid #4a3a2a;background:linear-gradient(180deg,#171d25,#0d1319);
    padding:26px 30px;border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.65)}
  #eventcard .band{height:3px;background:linear-gradient(90deg,var(--warn),transparent);margin-bottom:14px}

  #cursor{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:1px dashed var(--acc);
    border-radius:50%;display:none;pointer-events:none;z-index:5}
  #cursor:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--acc);border-radius:50%}
  #range{position:absolute;border:1px dashed rgba(224,163,62,.7);border-radius:50%;display:none;
    transform:translate(-50%,-50%);pointer-events:none;z-index:4}
  #range.drop{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset}
  #ping{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid #fff;opacity:0;pointer-events:none;z-index:6}

  /* ===== 顶栏 ===== */
  #top{position:absolute;left:0;top:0;right:0;height:56px;background:rgba(10,13,18,.9);
    border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:30}
  #clock{font-family:var(--mono);font-size:23px;color:#fff;line-height:1}
  #icons{display:flex;gap:6px;margin-left:auto;align-items:center}
  .ic{width:36px;height:34px;border:1px solid var(--line2);border-radius:3px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:0;font-family:var(--mono);font-size:10px;color:var(--ink2);
    cursor:pointer;background:#121822;line-height:1.15;position:relative}
  .ic b{font-weight:500;font-size:11px}
  .ic span{font-size:7px;color:#4c5563;letter-spacing:.02em}
  .ic:hover,.ic.on{border-color:var(--acc);color:var(--acc)}
  .ic:hover span{color:var(--acc)}

  /* ===== 左功能栏（栏框，不是抽屉） ===== */
  #leftrail{position:absolute;left:0;top:56px;bottom:250px;width:56px;background:#0c1117;
    border-right:1px solid var(--line);z-index:24;display:flex;flex-direction:column;align-items:center;
    padding-top:8px;gap:6px;transition:width .16s ease,box-shadow .16s}
  #leftrail:hover{width:104px;box-shadow:8px 0 18px rgba(0,0,0,.45)}
  .rail{width:40px;height:40px;border:1px solid var(--line2);border-radius:3px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;color:var(--ink2);cursor:pointer;background:#111821;
    transition:width .16s ease,flex-direction .16s}
  #leftrail:hover .rail{width:88px;flex-direction:row;gap:7px;justify-content:flex-start;padding-left:9px}
  .rail:hover,.rail.on{border-color:var(--acc);color:var(--acc)}
  .rail b{font-family:var(--mono);font-size:12px;font-weight:500}
  .rail span{font-family:var(--mono);font-size:8px;letter-spacing:.05em;white-space:nowrap}
  #leftrail:not(:hover) .rail span{display:none}

  /* ===== 右信息栏（栏框） ===== */
  #rightpanel{position:absolute;right:0;top:56px;bottom:0;width:320px;background:#0c1117;
    border-left:1px solid var(--line);z-index:24;display:flex;flex-direction:column;overflow:hidden}
  .rp{padding:10px 12px;border-bottom:1px solid var(--line)}
  .rp .h{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink3);margin-bottom:6px}
  .rp .big{font-family:var(--mono);font-size:22px;color:#fff;line-height:1.1}
  .rp .rowline{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;padding:2px 0}
  .irow{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #1b222b}
  .irow:last-child{border-bottom:0}

  /* ===== 手牌：没有栏，十张卡直接浮在世界底边（自走棋 / 炉石口径） ===== */
  #hand{position:absolute;left:56px;right:320px;bottom:0;height:300px;pointer-events:none;z-index:32}
  .cardslot{position:absolute;bottom:8px;width:140px;height:204px;pointer-events:auto;
    transition:bottom .16s cubic-bezier(.2,.9,.2,1)}
  .cardslot:hover{bottom:30px;z-index:60}
  .card{width:140px;height:204px;border:1px solid #2c3644;border-radius:5px;background:#111820;
    display:flex;flex-direction:column;overflow:hidden;position:relative;cursor:grab;user-select:none;
    transform-origin:50% 160%;transform:rotate(var(--r,0deg)) translateY(var(--l,0px));
    transition:transform .16s cubic-bezier(.2,.9,.2,1),box-shadow .16s,border-color .16s;
    box-shadow:0 8px 18px rgba(0,0,0,.5)}
  .cardslot:hover .card{transform:rotate(0deg) translateY(-14px) scale(1.08);
    box-shadow:0 18px 34px rgba(0,0,0,.6);border-color:#7b8b9d}
  .card.sel{border-color:var(--acc);outline:1px solid var(--acc);outline-offset:-1px;
    transform:rotate(0deg) translateY(-24px) scale(1.04)}
  .card.dragging{opacity:.3}
  .card .art{flex:1;position:relative;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 8%,color-mix(in srgb,var(--c) 46%,#0d1319) 0%,#121a24 60%,#0b1117 100%)}
  .card .art:after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(38deg,rgba(0,0,0,.22) 0 1px,transparent 1px 7px);opacity:.45}
  .card .art svg{position:absolute;inset:0;width:100%;height:100%;opacity:.92;color:#e2eaf1}
  .card .dots{position:absolute;right:7px;top:7px;display:flex;gap:2px}
  .card .dots i{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.18)}
  .card .dots i.on{background:var(--c)}
  .card .nm{height:24px;display:flex;align-items:center;justify-content:center;font-size:11.5px;
    color:#e8eef4;background:#0d141b;border-top:1px solid #222c38;letter-spacing:.04em}

  /* 悬浮卡详情（自走棋式：平时不解释，悬停才出） */
  #cardtip{position:fixed;z-index:120;display:none;width:250px;border:1px solid #3d4a5c;
    background:rgba(9,13,18,.97);padding:11px 13px;border-radius:3px;box-shadow:0 16px 34px rgba(0,0,0,.62)}
  #cardtip .t1{font-size:15px;color:#fff}
  #cardtip .t2{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:2px}
  #cardtip .t3{font-size:12.5px;color:#c6d2de;margin-top:8px;line-height:1.65}
  #cardtip .t4{font-family:var(--mono);font-size:10px;color:var(--acc);margin-top:8px}

  .el{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
  #ghost{position:fixed;width:140px;height:204px;pointer-events:none;z-index:99;opacity:.9;transform:translate(-70px,-102px)}
  #ghost .tip{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font-family:var(--mono);
    font-size:11px;color:var(--acc);text-shadow:0 1px 3px #000}
  #ghost.rec .tip{color:var(--warn)}
  /* 动作条：只有图标，说明交给设置里的键位表 */
  #actbar{position:absolute;right:344px;bottom:22px;display:flex;flex-direction:column;gap:9px;z-index:34}
  .ab{width:42px;height:42px;border-radius:50%;border:1px solid #33404f;background:rgba(14,19,26,.88);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:#b9c6d3;cursor:pointer;
    transition:border-color .14s,color .14s,transform .14s}
  .ab:hover{border-color:var(--acc);color:var(--acc);transform:scale(1.06)}

  /* ===== 面板 ===== */
  #overlay{position:absolute;inset:0;z-index:40;display:none}
  #overlay.show{display:block}
  #ovbg{position:absolute;inset:0;background:rgba(4,6,9,.74)}
  #panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1560px;height:880px;
    background:#0f141b;border:1px solid var(--line2);display:flex;flex-direction:column}
  #phead{height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}
  #pbody{flex:1;overflow:auto;padding:18px}
  #pfoot{height:52px;display:flex;align-items:center;gap:10px;padding:0 18px;border-top:1px solid var(--line)}
  .close{margin-left:auto;cursor:pointer}

  /* toast */
  #toasts{position:absolute;left:70px;bottom:266px;z-index:35;display:flex;flex-direction:column;gap:8px}
  .toast{width:420px;border:1px solid var(--acc);border-left:3px solid var(--acc);background:rgba(20,16,10,.95);padding:10px 12px;font-size:12px}
  .toast .t{font-family:var(--mono);font-size:10px;color:var(--acc)}
  .toast .d{margin-top:4px;line-height:1.5}

  /* ===== 创世（纯随机揭示：只能重掷，不能选） ===== */
  #creator{position:absolute;inset:0;z-index:60;background:linear-gradient(#080b10,#05080b);display:flex;flex-direction:column}
  #ctop{height:64px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:#0a0e13}
  #cmain{flex:1;display:flex;min-height:0;position:relative}
  #cmain.roll{animation:rollIn .6s cubic-bezier(.2,.9,.2,1) both}
  @keyframes rollIn{0%{opacity:.1;filter:blur(9px);transform:scale(.985)}55%{opacity:1;filter:blur(1.5px)}100%{opacity:1;filter:none;transform:none}}
  .dust{position:absolute;inset:0;z-index:70;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,rgba(224,163,62,.12),transparent 62%);
    animation:dustSweep .5s ease both}
  @keyframes dustSweep{0%{opacity:0;transform:translateX(-7%)}45%{opacity:1}100%{opacity:0;transform:translateX(7%)}}

  /* 进界转场 */

function cvHi(name){
  const box=document.getElementById('cutaway');

  const gs=box.querySelectorAll('.cvt');
  let hit=false;
  gs.forEach(g=>{
    const match = name && g.getAttribute('data-x')===name;
    g.classList.toggle('hl', !!match);
    if(match) hit=true;
  });
  box.classList.toggle('dim', !!name && hit);

  if(hint){
    hint.textContent = (name && CV_LABEL[name]) ? `${name} · 图上高亮：${CV_LABEL[name]}` : '';

function cutawayFor(){
  const f=S.form;
  const T=S.traits.map(i=>TRAITS[i][1]);
  const has=n=>T.includes(n);

  const LAND={
    '单岛界':'M60,300 C180,196 820,196 940,300 L940,520 L60,520 Z',
    '大陆界':'M-30,282 C160,232 840,232 1030,282 L1030,520 L-30,520 Z',
    '半岛界':'M-30,292 C120,210 520,206 700,262 L700,520 L-30,520 Z',
    '群岛界':'M30,330 C80,294 180,294 230,330 L230,520 L30,520 Z '+
             'M370,314 C430,274 560,274 620,314 L620,520 L370,520 Z '+
             'M760,336 C810,300 910,300 960,336 L960,520 L760,520 Z',
    '环礁界':'M50,352 C110,322 210,320 270,344 L270,520 L50,520 Z '+
             'M730,344 C790,320 890,322 950,352 L950,520 L730,520 Z',
    '峡湾界':'M60,300 C180,196 820,196 940,300 L940,520 L60,520 Z',
    '内陆湖国':'M60,296 C180,200 820,200 940,296 L940,520 L60,520 Z',
    '裂谷界':'M60,292 C180,196 820,196 940,292 L940,520 L60,520 Z',
    '全海界':'',
    '全陆界':'M-30,268 C160,238 840,238 1030,268 L1030,520 L-30,520 Z'
  };
  const land=(f in LAND)?LAND[f]:LAND['单岛界'];
  const wet = !['全陆界','内陆湖国'].includes(f);
  const surf={ '大陆界':282,'全陆界':268,'半岛界':292,'群岛界':322,'环礁界':348 }[f] || 300;

  /* 林带跟着地表走（只给有陆地的形制） */
  const treeLine = f==='群岛界'
    ? [[70,300,120],[400,282,150],[790,304,120]]
    : [[120,0,880]];
  const trees = [];
  treeLine.forEach(([x0,,x1])=>{
    for(let x=x0;x<x1;x+=30){
      const rx = f==='群岛界'? 0.5 : (x-60)/880;
      const y = surf - (f==='群岛界'?18:96*Math.sin(Math.PI*Math.min(1,Math.max(0,rx))));
      const h=9+((x*7)%9);
      trees.push(`<path d="M${x},${y-h} L${x+4},${y} L${x-4},${y} Z" fill="#3c7048" opacity=".92"/>`);
    }
  });

  /* 特征可视化 */
  const oreCount = has('金属富集')?14:6;
  const ore = `<g class="cvt" data-x="金属富集">${Array.from({length:oreCount},(_,i)=>{
    const x=140+((i*137)%700), y=396+((i*53)%70);
    return `<circle cx="${x}" cy="${y}" r="2.6" fill="#c79a54"/>`;
  }).join('')}</g>`;

  const volcano = `<g class="cvt" data-x="地热活跃">${has('地热活跃')?`
    <path d="M${560},${surf} L610,${surf-86} L640,${surf-86} L690,${surf} Z" fill="#4a3b33"/>
    <path d="M628,${surf-86} L640,${surf-86} L648,${surf-70} L620,${surf-70} Z" fill="#b4553f" opacity=".9"/>
    <path d="M636,${surf-70} C636,${surf-40} 630,${surf-20} 626,${surf}" stroke="#c4643f" stroke-width="3" fill="none" opacity=".8"/>`:''}</g>`;

  const geyser = `<g class="cvt" data-x="地热活跃">${has('地热活跃')?
    [0,1,2].map(k=>{const x=180+k*60;
      return `<path d="M${x},${surf} C${x-2},${surf-26} ${x+3},${surf-44} ${x},${surf-62}"
        stroke="#cfe0e6" stroke-width="2" fill="none" opacity=".35"/>`}).join(''):''}</g>`;

  const giantTree = `<g class="cvt" data-x="古树群">${has('古树群')?`
    <path d="M300,${surf+4} L300,${surf-64}" stroke="#4a3a2a" stroke-width="7"/>
    <path d="M300,${surf-118} L330,${surf-58} L270,${surf-58} Z" fill="#3f7549"/>
    <path d="M300,${surf-140} L324,${surf-92} L276,${surf-92} Z" fill="#4a8554"/>`:''}</g>`;

  const floating = `<g class="cvt" data-x="浮空岛">${has('浮空岛')?`

  const moons = `<g class="cvt" data-x="双月">${has('双月')?`

  const storm = `<g class="cvt" data-x="永久雷暴">${has('永久雷暴')?`

    <ellipse cx="500" cy="${surf+8}" rx="200" ry="26" fill="#1d4a5c"/>
    <ellipse cx="500" cy="${surf+8}" rx="200" ry="26" fill="none" stroke="#3f7fa8" opacity=".6"/>`:'';

  const reef = f==='全海界'?`

const SEEDCODE={'群岛界':'ARC','单岛界':'ISL','大陆界':'CON','半岛界':'PEN','环礁界':'ATL',

const SUFFIX={'群岛界':'屿','单岛界':'岛','大陆界':'原','半岛界':'岬','环礁界':'环礁',
  '峡湾界':'湾','内陆湖国':'泊','裂谷界':'裂谷','全海界':'海','全陆界':'陆'};
const SYL1=['灰','白','长','碎','冷','雾','沉','青','赤','双','孤','暖'];
const SYL2=['羽','石','脊','沙','潮','星','苔','纹','岚','野'];

function rollWorld(){
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const rand=(a,b)=>a+Math.random()*(b-a);
  S.form = pick(FORMS)[0];
  S.climate = pick(CLIMATES);
  S.name = pick(SYL1)+pick(SYL2)+SUFFIX[S.form];
  const n = 3+Math.floor(Math.random()*3);
  S.traits = [...TRAITS.keys()].sort(()=>Math.random()-.5).slice(0,n).sort((a,b)=>a-b);
  const seg=()=>Math.random().toString(32).slice(2,6).toUpperCase();
  S.seed=['SOL',SEEDCODE[S.form]||'NET',seg(),seg()];
  const fish = 0.30+Math.random()*0.5;
  S.params={
    water: Math.round(fish*100)+' %',
    blocks: S.form==='全海界'?'0':S.form==='群岛界'?'5–12':S.form==='大陆界'?'1（≥85 %）':'1–4',
    ranges: 1+Math.floor(Math.random()*4),
    species: 5+Math.floor(Math.random()*5),
    settle: 2+Math.floor(Math.random()*4),
    wonder: Math.random()<0.55?'1 处':'无'
  };
  S.log=[
    ['陆块拓扑', S.params.blocks, '形制'],
    ['陆块形状', pick(['团块','长条','折枝','环','破碎']), '形制'],
    ['界缘交代', pick(['外海','雾墙','云海','深渊','冰盖']), '形制'],
    ['水覆盖', S.params.water, '水'],
    ['陆海比', rand(0.2,0.85).toFixed(2), '水'],
    ['起伏 relief', rand(0.35,1).toFixed(2), '地貌'],
    ['山系数', S.params.ranges, '地貌'],
    ['山系走向', pick(['NNE','ESE','SSW','WNW'])+' '+Math.round(rand(0,180))+'°', '地貌'],
    ['气候带', S.climate, '气候'],
    ['风向', pick(['NE','SE','SW','NW'])+' '+Math.round(rand(0,360))+'°', '气候'],
    ['植被密度', rand(0.3,1).toFixed(2), '生命'],
    ['物种池', S.params.species+' 种', '生命'],
    ['奇观', S.params.wonder, '生命'],
    ['界名', S.name, '命名'],
    ['判据', '7 / 7 PASS', '校验']
  ];
  S.rolls = (S.rolls||0)+1;
}
function copySeed(){
  const t=S.seed.join('-');
  if(navigator.clipboard) navigator.clipboard.writeText(t);
  toast('坐标已复制',t+' — 别人粘贴同一串就能得到这一界');
  log('复制坐标 '+t);
}
function rerollSeed(){
  const host=document.getElementById('cmain');
  if(!host){ rollWorld(); render(); return; }
  const d=document.createElement('div'); d.className='dust'; host.appendChild(d);
  setTimeout(()=>{
    rollWorld(); render();
    const m=document.getElementById('cmain');
    if(m){ m.classList.add('roll'); }
    log('重掷：'+S.name+' · '+S.form+' · '+S.climate, true);
  },170);
}
function enterWorld(){
  S.screen='world';
  if(!S.hand.length) drawHand();
  render();
  const st=document.getElementById('stage');
  if(st){ st.classList.remove('entering'); void st.offsetWidth; st.classList.add('entering'); }
  const fd=document.getElementById('fade');
  if(fd){ fd.classList.add('on'); setTimeout(()=>fd.classList.remove('on'),40); }
  setTimeout(()=>{ if(st) st.classList.remove('entering'); }, 1500);
  log('进入世界：'+S.name+' · '+S.form+' · '+S.climate, true);
}

function cardHTML(c,i,fan){
  const [el,tier,kind,name]=c;
  const col=ELC[el]||'#7e8a9a';
  const vars=fan?`--r:${fan.r}deg;--l:${fan.l}px;`:'';
  const hover=i>=0?`onmouseenter="showCardTip(event,${i})" onmouseleave="hideCardTip()"`:'';
  return `<div class="card ${i===S.sel?'sel':''}" data-i="${i}" style="${vars}" ${hover}
    onpointerdown="startDrag(event,${i})">
    <div class="art" style="--c:${col}">
      <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">${SIGIL[el]||SIGIL['水']}</svg>
      <div class="dots">${Array.from({length:10},(_,k)=>`<i class="${k<tier?'on':''}"></i>`).join('')}</div>
    </div>
    <div class="nm">${name}</div>
  </div>`;
}
function showCardTip(e,i){
  if(S.drag) return;
  const c=S.hand[i]; if(!c) return;
  const tip=document.getElementById('cardtip'); if(!tip) return;
  const r=e.currentTarget.getBoundingClientRect();
  tip.innerHTML=`<div class="t1">${c[3]}</div>
    <div class="t2">${c[0]} · ${c[1]===10?'超环':c[1]+' 环'} · ${c[2]}</div>
    <div class="t3">${fxOf(c)}</div>
    <div class="t4">${c[1]===0?'0 环 · 免费 · 用完即回':(c[1]<9?'回收 +'+reclaimValue(c):'9 环 · 不可回收')}</div>`;
  tip.style.display='block';
  const w=250, h=tip.offsetHeight;
  tip.style.left=Math.max(10,Math.min(r.left+r.width/2-w/2, window.innerWidth-w-12))+'px';
  tip.style.top=Math.max(10, r.top-h-14)+'px';
}
function hideCardTip(){ const t=document.getElementById('cardtip'); if(t) t.style.display='none'; }

/* =========================================================================
   拖放：向上=释放，向下=回收，拖到地面=指定落点
   ========================================================================= */
function startDrag(e,i){
  if(i<0 || !S.hand[i]) return;
  e.preventDefault();
  const c=S.hand[i]; if(!c) return;
  selectCard(i);
  S.drag={i, x0:e.clientX, y0:e.clientY, moved:false, overWorld:false, mode:'idle'};
  const g=document.createElement('div'); g.id='ghost';
  g.innerHTML=cardHTML(c,i)+'<div class="tip"></div>';
  g.querySelector('.card').classList.remove('sel');
  document.body.appendChild(g);
  moveGhost(e.clientX,e.clientY);
  document.addEventListener('pointermove',onDrag);
  document.addEventListener('pointerup',endDrag,{once:true});
}
function moveGhost(x,y){
  const g=document.getElementById('ghost');
  if(g){ g.style.left=x+'px'; g.style.top=y+'px'; }
}
function onDrag(e){
  if(!S.drag) return;
  const dx=e.clientX-S.drag.x0, dy=e.clientY-S.drag.y0;
  if(Math.abs(dx)+Math.abs(dy)>6) S.drag.moved=true;
  moveGhost(e.clientX,e.clientY);

  const sceneEl=document.getElementById('scene');
  let sx=0, sy=0, inWorld=false;
  if(sceneEl){
    const r=sceneEl.getBoundingClientRect(), k=r.width/sceneEl.offsetWidth;
    sx=(e.clientX-r.left)/k; sy=(e.clientY-r.top)/k;
    inWorld = sx>0 && sx<sceneEl.offsetWidth && sy>0 && sy<sceneEl.offsetHeight;
  }

  const g=document.getElementById('ghost'), tip=g&&g.querySelector('.tip');
  const rg=document.getElementById('range');
  const card=S.hand[S.drag.i];

  if(dy>90){                       // 向下拖 = 回收
    g&&g.classList.add('rec');
    tip&&(tip.textContent='松手回收 +'+reclaimValue(card));
    rg&&(rg.style.display='none');
    S.drag.mode='reclaim';
  } else if(dy<-40 && S.drag.moved){  // 向上拖 = 释放（随机落点）
    g&&g.classList.remove('rec');
    tip&&(tip.textContent='松手释放（随机落点）');
    rg&&(rg.style.display='none');
    S.drag.mode='castRandom';
  } else if(inWorld && S.drag.moved){  // 在地面上 = 指定落点
    g&&g.classList.remove('rec');
    tip&&(tip.textContent='松手释放到此处');
    if(rg){
      const R=radiusPx(card[1]);
      rg.style.display='block';
      rg.style.left=sx+'px'; rg.style.top=sy+'px';
      rg.style.width=(R*2)+'px';
      rg.style.height=(R*2*(S.pitch>=55?0.9:0.5))+'px';
      rg.classList.add('drop');
    }
    S.drag.mode='castAt'; S.drag.at={x:sx,y:sy};
  } else {                         // 原地/未移出 = 还没决定
    g&&g.classList.remove('rec');
    tip&&(tip.textContent='拖到地面指定落点 · 向上拖随机释放');
    rg&&(rg.style.display='none');
    S.drag.mode='idle';
  }
}
function endDrag(e){
  document.removeEventListener('pointermove',onDrag);
  const g=document.getElementById('ghost'); if(g) g.remove();
  const rg=document.getElementById('range'); if(rg){ rg.style.display='none'; rg.classList.remove('drop'); }
  const d=S.drag; S.drag=null;
  if(!d) return;
  if(d.mode==='reclaim') return reclaim();
  if(d.mode==='castAt') return castAt(d.at.x, d.at.y);
  if(d.mode==='castRandom') return castRandom();
  if(!d.moved) { selectCard(d.i); return; }
}

/* =========================================================================
   行为
   ========================================================================= */
function reclaimValue(card){ return card[1]===0?0:Math.round(5*Math.pow(1.5,card[1])*0.15); }
function selectCard(i){ S.sel=i; render(); }
function castAt(x,y){
  const c=S.hand[S.sel]; if(!c) return;
  const [el,tier,kind,name]=c;
  const gain = tier===0?3:4+tier*2;
  S.echo+=gain;
  S.echoLog.unshift([fmt(S.minute), name+' · '+tier+' 环', Math.max(gain,2), tier<=3?'小':'中']);
  addChron('干涉', '「'+name+'」落在 ('+Math.round(x)+','+Math.round(y)+')');
  ping(x,y);
  consumeAndDraw(S.sel);
  S.lastAction='释放 '+name;
  render(); toast('释放','「'+name+'」落在你指定的位置 · +'+gain+' 余响');
}
function castRandom(){
  const c=S.hand[S.sel]; if(!c) return;
  const x=760+Math.random()*440, y=560+Math.random()*140;
  castAt(x,y);
  toast('随机落点','没指定位置 → 落在世界中随机一处（拖着卡到地面可以指定）');
}
function reclaim(){
  const c=S.hand[S.sel]; if(!c) return;
  if(c[1]===0){ toast('不能回收','0 环卡免费且无限补，拆了不返余响'); return; }
  if(c[1]>=9){ toast('不能回收','超环 / 禁物不可回收（回收是止损，不是换钱）'); return; }
  const back=reclaimValue(c); S.echo+=back;
  log('回收「'+c[3]+'」+'+back,true);
  consumeAndDraw(S.sel);
  render(); toast('回收','「'+c[3]+'」→ +'+back+' 余响');
}
/* 消耗一张手牌：手牌从「实体池」里补，不从牌库凭空生成 */
function consumeAndDraw(i){
  const c=S.hand[i];
  S.hand.splice(i,1);
  const inHand=new Set(S.hand.map(x=>x.join('|')));
  const rest=S.owned.filter(x=>!inHand.has(x.join('|')));
  if(rest.length) S.hand.splice(i,0,rest[Math.floor(Math.random()*rest.length)].slice());
  S.sel=Math.min(S.sel, Math.max(0,S.hand.length-1));
}
function rerollHand(){
  drawHand();
  render(); log('从已有牌里重抽（不返余响）');
  toast('重抽','只从你**已有**的卡里换一手；没有的卡要去「抽卡」里开出来');
}
function cycleSpeed(){
  if(S.paused){S.paused=false;S.speed=4;}
  else if(S.speed===4)S.speed=20; else if(S.speed===20)S.speed=1; else S.paused=true;
  render();
}
function toggleAmbient(){ S.ambient=!S.ambient; render(); }
function addChron(k,w){ S.chron.unshift([fmt(S.minute),k,w]); if(S.chron.length>50)S.chron.pop(); }
function ping(x,y){
  const p=document.getElementById('ping'); if(!p) return;
  p.style.left=x+'px'; p.style.top=y+'px'; p.style.opacity=1;
  p.animate([{transform:'scale(.4)',opacity:1},{transform:'scale(3)',opacity:0}],{duration:600});
}
function setPitch(p){ S.pitch=p; render(); applyWorld(); }
function cycleZoom(d){ S.zoom=Math.min(4,Math.max(0,S.zoom+d)); render(); applyWorld(); }
function applyWorld(){
  const wg=document.getElementById('worldgroup'); if(!wg) return;
  const z={0:0.78,1:0.9,2:1,3:1.55,4:2.4}[S.zoom]||1;
  const shift={0:-30,1:-14,2:0,3:90,4:190}[S.zoom]||0;
  const squash={15:0.62,30:0.78,55:1.05,88:1.42}[S.pitch]||0.78;
  wg.style.transform=`translateY(${shift}px) scale(${z}) scaleY(${squash})`;
}

function bodyFor(p){
  if(p==='pack') return packBody();

function packNext(){
  const pk=PACKS[S.packKind||0];
  if(packStage===0){
    if(S.echo<pk[2]){ toast('余响不够',pk[0]+' 需要 '+pk[2]+' 余响，先做几次有意义的干涉'); return; }
    S.packCards = drawFromUniverse(pk[0]==='至日包'?3:5);
    S.echo-=pk[2]; log('抽卡「'+pk[0]+'」−'+pk[2]+' 余响',true);
  }
  if(packStage<3){
    packStage++;
    if(packStage===3) S.owned=uniqueOwned(S.owned.concat(S.packCards.map(c=>c.slice())));
  }
  else closePanel();
  render();
}
function drawFromUniverse(n){
  const have=new Set(S.owned.map(c=>c.join('|')));
  const pool=MORE.filter(c=>!have.has(c.join('|')));
  const src = pool.length?pool:MORE;
  const pick=[]; const used=new Set();
  while(pick.length<n){
    const i=Math.floor(Math.random()*src.length);
    if(used.has(i) && used.size<src.length) continue;
    used.add(i); pick.push(src[i].slice());
    if(used.size>=src.length) break;
  }
  pick.sort((a,b)=>a[1]-b[1]);   // 最后一张必为最高环
  return pick;
}

  const tab=S.keyTab||'全部';
  const dup=keyConflicts();
  const rows=KEYS.map((k,i)=>({k,i})).filter(o=>tab==='全部'||o.k[2]===tab);
  return `<div class="row gap6" style="margin-bottom:8px">
    ${tabs.map(t=>`<div class="btn ${tab===t?'on':'ghost'}" style="height:24px"
      onclick="S.keyTab='${t}';render()">${t}</div>`).join('')}
    <span class="xs" style="align-self:center;margin-left:auto">${
      dup.size?`⚠ ${dup.size} 组键位冲突（红框）`:'点「可改」的键位 → 按下新键；锁死键防误操作'}</span>
  </div>
  ${rows.map(({k,i})=>{
    const [name,cur,g,ed]=k, bad=dup.has(cur);
    return `<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #1a212a;${
      bad?'box-shadow:inset 2px 0 0 #b4553f;padding-left:6px':''}">
      <span class="xs" style="width:48px">${g}</span>
      <span class="sm" style="flex:1">${name}${bad?'<span class="tag warn" style="margin-left:6px">冲突</span>':''}</span>
      <div class="btn ${ed?'':'ghost'}" data-k="${i}" style="width:170px;height:26px"
        onclick="${ed?`rebind(${i})`:''}">${cur}</div>
      <span style="width:76px;text-align:right">${ed?'<span class="tag ok">可改</span>':'<span class="tag">锁死</span>'}</span>
    </div>`;}).join('')}`;
}
function rebind(i){
  waitingFor=i;
  const el=document.querySelector('[data-k="'+i+'"]');
  if(el){ el.textContent='等待按键…'; el.classList.add('on'); }
  log('等待按键：'+KEYS[i][0],true);
}
function captureKey(e){
  if(waitingFor<0) return false;
  const k=e.key.length===1?e.key.toUpperCase():e.key;
  const clash=KEYS.findIndex((r,j)=>j!==waitingFor && r[1].split(' / ').includes(k));
  const el=document.querySelector('[data-k="'+waitingFor+'"]');
  if(clash>=0){
    if(el) el.textContent='冲突：'+KEYS[clash][0];
    toast('键位冲突','「'+k+'」已被「'+KEYS[clash][0]+'」占用 → 交换 / 取消');
    waitingFor=-1; return true;
  }
  const idx=waitingFor;
  KEYS[idx][1]=k;
  if(el){ el.textContent=k; el.classList.remove('on'); }
  waitingFor=-1; render(); toast('已改键','「'+KEYS[idx][0]+'」→ '+k);
  return true;
}

/* =========================================================================
   世界交互：悬停地块信息 / 点击落点 / 落点环
   ========================================================================= */
const BIOMES=['水域','湿地','草原','林地','岩坡','雨林','荒漠','雪原','盐碱','灌丛','高山草甸','洞穴'];
function tileAt(x,y){
  const hx=Math.abs(Math.round(x*7+y*13));
  return {
    biome: BIOMES[hx%BIOMES.length],
    moist: (0.25+((hx*37)%70)/100).toFixed(2),
    bio: ['低','中','高'][hx%3],
    elev: (6+((hx*17)%52))+' m'
  };
}
function placeCursor(){
  const c=document.getElementById('cursor'), rg=document.getElementById('range');
  const scene=document.getElementById('scene');
  if(!c||!rg||!S.cursor||!scene) return;
  c.style.display='block'; c.style.left=S.cursor.x+'px'; c.style.top=S.cursor.y+'px';
  const card=S.hand[S.sel];
  if(card){
    const R=radiusPx(card[1]);
    rg.style.display='block'; rg.style.left=S.cursor.x+'px'; rg.style.top=S.cursor.y+'px';
    rg.style.width=(R*2)+'px';
    rg.style.height=(R*2*(S.pitch>=55?0.9:0.5))+'px';
  }
}
function bindScene(){
  const scene=document.getElementById('scene');
  if(!scene) return;
  scene.style.cursor='crosshair';
  scene.onclick=e=>{
    const r=scene.getBoundingClientRect(), k=r.width/scene.offsetWidth;
    const x=(e.clientX-r.left)/k, y=(e.clientY-r.top)/k;
    S.cursor={x,y}; placeCursor();
    const t=tileAt(x,y);
    log(`落点 ${Math.round(x)},${Math.round(y)} · ${t.biome}`);
  };
  scene.onmousemove=e=>{
    const r=scene.getBoundingClientRect(), k=r.width/scene.offsetWidth;
    const sx=(e.clientX-r.left)/k, sy=(e.clientY-r.top)/k;
    const t=tileAt(sx,sy);
    const ring=document.getElementById('hoverring'), info=document.getElementById('hoverinfo');
    if(!ring||!info) return;
    ring.style.display='block'; ring.style.left=sx+'px'; ring.style.top=sy+'px';
    info.style.display='block';
    info.style.left=Math.min(sx+24, scene.offsetWidth-200)+'px';
    info.style.top=Math.max(8, sy-46)+'px';
    info.innerHTML=`<b>${t.biome}</b> · 海拔 ${t.elev}<br>湿度 ${t.moist} · 生物量 ${t.bio}`;
  };
  scene.onmouseleave=()=>{
    const ring=document.getElementById('hoverring'), info=document.getElementById('hoverinfo');
    if(ring) ring.style.display='none';
    if(info) info.style.display='none';
  };
  if(S.cursor) placeCursor();
}

/* =========================================================================
   渲染主循环
   ========================================================================= */
function render(){
  const st=document.getElementById('stage');
  st.classList.toggle('ambient', !!S.ambient);
  st.innerHTML = S.screen==='creator' ? creatorHTML() : worldHTML();
  if(S.screen==='world'){
    st.insertAdjacentHTML('beforeend','<div id="overlay" class="'+(S.panel?'show':'')+'">'+(S.panel?panelHTML():'')+'</div>');
    st.insertAdjacentHTML('beforeend','<div id="toasts"></div>');
  }
  document.getElementById('barTitle').textContent =
    S.screen==='creator'?'创世':(S.panel?({pack:'抽卡',codex:'卡库',chron:'年表',settings:'设置',keys:'键位',help:'帮助'})[S.panel]:'世界');
  document.getElementById('barState').textContent=`俯仰 ${S.pitch}° · Z${S.zoom} · ${S.paused?'暂停':S.speed+'×'}`;
  if(S.screen==='world'){ applyWorld(); bindScene(); }
  syncSteps();
}

/* =========================================================================
   键盘
   ========================================================================= */
document.addEventListener('keydown',e=>{
  if(captureKey(e)){ e.preventDefault(); return; }
  const k=e.key;
  if(k==='Escape'){ if(S.event)closeEvent(); else if(S.panel)closePanel(); else if(S.ambient)toggleAmbient(); return; }
  if(S.screen==='creator'){
    if(k==='Enter') enterWorld();
    return;
  }
  if(k===' '){ e.preventDefault(); castRandom(); }
  else if(k==='x'||k==='X') reclaim();
  else if(k==='r'||k==='R') rerollHand();
  else if(k==='j'||k==='J') cycleSpeed();
  else if(k==='p'||k==='P') toggleAmbient();
  else if(k==='e'||k==='E') fireEvent();
  else if(k==='Tab'){ e.preventDefault(); document.getElementById('leftrail').style.display =
      document.getElementById('leftrail').style.display==='none'?'flex':'none'; }
  else if(k==='z') cycleZoom(1);
  else if(k==='Z') cycleZoom(-1);
  else if(k==='F1') setPitch(15); else if(k==='F2') setPitch(30);
  else if(k==='F3') setPitch(55); else if(k==='F4') setPitch(88);
  else if(k==='c'||k==='C') openPanel('chron');
  else if(k==='b'||k==='B') openPanel('pack');
  else if(k==='l'||k==='L') openPanel('codex');
  else if(k==='g'||k==='G') openPanel('creator');
  else if(k==='o'||k==='O') openPanel('settings');
  else if(k==='h'||k==='H') openPanel('help');
  else if(/^[1-9]$/.test(k)) selectCard(Math.min(parseInt(k)-1,S.hand.length-1));
  else if(k==='0') selectCard(Math.min(9,S.hand.length-1));
});

/* =========================================================================
   流程栏
   ========================================================================= */
const STEPS=[
  ['S0','创世（缺氧式）',()=>{S.screen='creator';S.panel=null;render();}],
  ['S1','进入世界（动画）',()=>{S.screen='world';if(!S.hand.length)drawHand();S.panel=null;render();
    setTimeout(()=>{const sc=document.getElementById('scene');if(sc)sc.classList.add('enter');},30);}],
  ['S2','左栏：六个入口',()=>{S.screen='world';S.panel=null;render();toast('左栏','只放页面入口：抽卡 / 卡库 / 年表 / 创世 / 设置 / 帮助；底部是摆件开关');}],
  ['S3','右栏：三段信息',()=>{S.screen='world';render();toast('右栏','一屏三段：这一界 / 生态 / 刚刚发生——不用切页签');}],
  ['S4','拖卡到地面 → 指定落点',()=>{S.screen='world';S.sel=0;render();
    toast('拖放','按住手牌拖到地面上，松手就在那里生效；向上拖=释放，向下拖=回收');}],
  ['S5','空格 = 随机释放',()=>{S.screen='world';render();castRandom();}],
  ['S6','抽卡（唯一获取途径）',()=>{S.screen='world';openPanel('pack');}],
  ['S7','卡库（只显示已有）',()=>{openPanel('codex');}],
  ['S8','R 重抽（从已有牌）',()=>{S.panel=null;S.screen='world';rerollHand();}],
  ['S9','设置 / 键位重绑',()=>{openPanel('keys');}],
  ['S10','视角 F1–F4',()=>{S.screen='world';setPitch(30);toast('视角','15 侧视 / 30 默认 / 55 俯瞰 / 88 图纸');}],
  ['S11','缩放 Z0–Z4',()=>{S.screen='world';cycleZoom(1);}],
  ['S12','摆件模式',()=>{S.screen='world';S.ambient=true;render();}]
];
STEPS.forEach(([id,name,fn])=>{
  const li=document.createElement('li');
  li.innerHTML=`<b>${id}</b><span>${name}</span>`;
  li.onclick=fn;
  document.getElementById('steps').appendChild(li);
});
function syncSteps(){
  const cur = S.screen==='creator'?0:
    S.panel==='pack'?6:S.panel==='codex'?7:S.panel==='keys'?9:S.panel?9:
    S.ambient?12: S.lastAction?5:1;
  [...document.getElementById('steps').children].forEach((li,i)=>li.classList.toggle('on',i===cur));
}

function reset(){
  Object.assign(S,{screen:'creator',owned:ZERO.map(c=>c.slice()),hand:[],sel:0,echo:128,
    pitch:30,zoom:2,speed:4,paused:false,panel:null,echoLog:[],chron:[],ambient:false,
    lastAction:'',packCards:[]});
  rollWorld();
  document.getElementById('log').innerHTML=''; render();
}

function fit(){
  const wrap=document.getElementById('wrap');
  const s=Math.min((wrap.clientWidth-16)/1920,(wrap.clientHeight-16)/1080);
  document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`;
}
window.onresize=fit;
rollWorld(); drawHand(); render(); fit();
</script>
