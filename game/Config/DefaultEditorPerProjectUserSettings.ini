; Solstice - editor / Play-in-Editor defaults. Checked in so every clone and every host
; starts from the same behaviour.
;
; This config category is read in three layers, later wins:
;   Engine/Config/BaseEditorPerProjectUserSettings.ini                (engine defaults)
;   game/Config/DefaultEditorPerProjectUserSettings.ini               <- this file
;   game/Saved/Config/<Platform>/EditorPerProjectUserSettings.ini     (per user, wins)
; Touching the same setting in Editor Preferences writes that third file, and its copy
; overrides this one from then on. Saved/ is gitignored, so a fresh clone always starts here.
;
; Why bother: the realm is spawned by ASolsticeGameMode::StartPlay(), and StartPlay only runs
; in a played world - the editor world is always empty and unlit by design (see
; docs/tech/STRUCTURE.md SS0). Playing is therefore the only way to see the game, so the
; default Play should land somewhere usable instead of inside the level viewport.

[/Script/UnrealEd.LevelEditorPlaySettings]
; EPlayModeType::PlayMode_InEditorFloating = "New Editor Window (PIE)". Both the Play button
; and Alt+P follow this value (UnrealEd/Private/Kismet2/DebuggerCommands.cpp:
; GetLastPlaySessionCommand reads the CDO copy of it).
LastExecutedPlayModeType=PlayMode_InEditorFloating

; Size of that window, in pixels. 0 would mean "use the desktop resolution" - we pin it so
; screenshots and framing are comparable across sessions.
NewWindowWidth=1920
NewWindowHeight=1080

; Centre the window on every launch. Keep this True: when it is False, PIE writes the last
; dragged window size back into NewWindowWidth/LastSize (UnrealEd/Private/PlayLevel.cpp:655)
; and the two values above stop being honoured.
CenterNewWindow=True

[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
; The editor-side MCP bridge (http://127.0.0.1:8000/mcp) that AI tooling drives for
; StartPIE / StopPIE / CaptureEditorImage. Auto-start it with every editor session so the
; dev loop does not depend on anyone typing a console command by hand.
bAutoStartServer=True
ServerPortNumber=8000
