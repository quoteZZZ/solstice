; Solstice - project identity and packaging.
;
; Scope rule: UGeneralProjectSettings is UCLASS(config=Game), so this is the only ini the engine
; reads it from. GameEngine.cpp:488 pulls ProjectDisplayedTitle straight out of GGameIni - the
; same keys kept in DefaultEngine.ini would parse fine and never be read.
;
; Display-name rule (GDD SS0): the project name is `Solstice`. A Chinese name is still TBD and is
; deliberately not invented here. 《至日 · 岁局》 is the archived auto-chess card form's name and
; must not come back (docs/archive/README.md).

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=8F1C4A2E4E0B4E1E9C7A5D3B1F6A2C40
ProjectName=Solstice
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "Solstice")
ProjectVersion=0.1.0
CompanyName=Solstice
Description=Solstice - a self-living paper diorama miniature world (perpetual god sandbox).

[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Development
UsePakFile=True
bUseIoStore=True
+DirectoriesToAlwaysCook=(Path="/Game/Core")
+DirectoriesToAlwaysCook=(Path="/Game/World")
+DirectoriesToAlwaysCook=(Path="/Game/Cards")

[/Script/Engine.GameSession]
MaxPlayers=1
