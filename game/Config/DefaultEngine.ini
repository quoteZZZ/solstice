; Solstice - engine configuration.
;
; There is deliberately no level content: the realm is spawned from code by
; /Script/Solstice.SolsticeGameMode, and the startup map is the engine's own empty Entry map.
; That is what keeps docs/tech/STRUCTURE.md SS0 honest - every binary asset the game needs is
; either rebuildable from the contracts in Config/Solstice/ or generated by the editor module.
;
; Scope rule: this file only carries settings whose owner class is `config=Engine`.
; The project identity block (name / displayed title / company / description) used to live here
; and never took effect: UGeneralProjectSettings is UCLASS(config=Game), so the engine only ever
; reads it from DefaultGame.ini (see GameEngine.cpp:488, which reads ProjectDisplayedTitle from
; GGameIni). It now lives where it is actually read.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
ServerDefaultMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/Solstice.SolsticeGameMode
GameInstanceClass=/Script/Solstice.SolsticeGameInstance

[/Script/Engine.RendererSettings]
; ---- REBOOT B0：把管线从「平涂」重开成「真实光照 + 卡通量化」 ----
;
; 这里曾经把 AO / GI / SSR / 虚拟阴影 / 大气全部关掉，理由是「纸感风格要便宜」。
; 代价是：Unlit 材质收不到任何光，世界只能是贴纸。REBOOT（docs/plan/REBOOT.md SS4）
; 改为 —— 光照全部走引擎，卡通感交给后处理色阶。下面每一项都写明为什么开。
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=1
r.DefaultFeature.MotionBlur=False          ; 卡通风杀手，永远关
r.DefaultFeature.LensFlare=False
; SSAO：物体与地面之间的接触暗部，是「焊在地上」而不是「贴上去」的关键
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=1.0
r.DefaultFeature.Bloom=True
; TSR：5.8 里的 4 = TSR。这是「高清」最直接的一项（超分 + 稳定边缘）
r.AntiAliasingMethod=4
; ---- 2026-10-19：切换到 Tiny Glade 对标 ----------------
;
; 用户裁定画面「像十几年前的游戏」，这个判断是对的，而且原因不在这条管线的参数里。
;
; Tiny Glade 的 GI 是软件光追（代理几何 BVH + 4x4 子采样 + 球谐平滑 + 后处理降噪），
; Digital Foundry 的原话是 "the RTGI is the gel that holds the visuals together" ——
; 它让背光面「自然变暗而不是死黑，也不发光」。这正是本工程一直缺的一环：
; 没有 GI 时，背光面只能靠一个常数天光填，结果要么是黑洞要么发灰，物体之间也没有
; 光在弹射，石头和草看起来是「各自被打亮的」，而不是「在同一个空间里」。
;
; 2 = Screen Space GI。**实测 Lumen 在本工程无效**：Lumen 需要为每个网格生成
; Surface Cache（Nanite 或 mesh distance field），而 ProceduralMeshComponent 两者都不提供，
; 于是 Lumen 里没有场景表示、帧时间一位不涨。判据是关掉天光后背面纯黑（见 tmp/review/tg_nosky.png），
; 说明没有任何间接光。
;
; SSGI 走屏幕空间，不需要场景表示，所以对程序化网格有效。实测画面：树冠出现互相照亮的
; 暖绿溢出，暗部有层次（tmp/review/tg_ssgi.png）。代价是屏幕外的信息会丢失——
; 要拿回完整 GI，必须把地形转成 StaticMesh 或 Nanite，那是架构级改动，另立一项。
r.DynamicGlobalIlluminationMethod=2
; 2 = SSR，暂时保留：Lumen 反射目前只在海面有意义，而海面已经有一套自定义菲涅尔。
r.ReflectionMethod=2
; 0 = 虚拟阴影**同样无效**。VSM 依赖 Nanite 或距离场来建立页表，ProceduralMesh 两者都没有，
; 实测开关前后三项指标逐位一致（0.405 / 0.518 / 0.051），说明它没有参与任何像素。
; 要软阴影，只能走"地形转 StaticMesh"这条路——和 Lumen 是同一项前置条件。
r.Shadow.Virtual.Enable=0
r.AllowStaticLighting=False
r.Nanite.ProjectEnabled=True               ; 为 B3 起「烘焙成 StaticMesh 再开 Nanite」做准备
r.GenerateMeshDistanceFields=True          ; SSR 与接触阴影依赖它
r.SkinCache.CompileShaders=False
r.SupportSkyAtmosphere=True                ; B2 的太阳高度角与大气散射要用
r.SupportLocalFogVolumes=False
r.SupportVolumetricFog=False               ; 近景雾仍用平面层；体积云是 B2 单独加

[/Script/Engine.Engine]
bSmoothFrameRate=True
MinSmoothedFrameRate=22
MaxSmoothedFrameRate=120

[SystemSettings]
; Lumen 走硬件光追。ProceduralMeshComponent 默认不参与 mesh distance field 生成，
; 所以软件光追（r.Lumen.HardwareRayTracing=0，即追 SDF）在这个工程里等于没开。
; RTX 5060 支持 RT，这条是本次画面升级生效的前提。
r.Lumen.HardwareRayTracing=1
; 半透明体积光照对本工程没有意义（唯一半透明面是墨线外壳），关掉省一档开销。
r.Lumen.TranslucencyVolume=0
; 关掉编辑器首页（Home Panel）。它是本工程唯一的联网探测发起方：
;   SHomeScreen::CheckInternetConnection()（Engine/Source/Editor/MainFrame/Private/HomeScreen/SHomeScreen.cpp:939）
;   每轮 3 次重试 x 3 秒超时，打 https://www.google.com/generate_204。
; 本机连不上 Google，于是日志被 "LogHttp: Warning: HTTP request timed out" 反复刷屏。
; HomeScreen.EnableHomeScreen 是 ECVF_ReadOnly（MainFrameModule.cpp:54，默认 true），
; 官方帮助文本明确说"值可以在配置文件里改"，所以只能在这里关，控制台改不动。
; 想恢复首页：改成 True（或删掉这两行）并重启编辑器。
HomeScreen.EnableHomeScreen=False

